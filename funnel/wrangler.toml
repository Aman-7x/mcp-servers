name = "mcp-funnel"
main = "../billing/src/funnel-worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
account_id = "dd3f2a29b7707e21a87f26a622c0bb9d"
workers_dev = false

# Private cross-worker Durable Object; no public route or record endpoint.
[[durable_objects.bindings]]
name = "FUNNEL"
class_name = "FunnelState"

[[migrations]]
tag = "funnel_state_v1"
new_sqlite_classes = ["FunnelState"]

[version_metadata]
binding = "CF_VERSION_METADATA"
