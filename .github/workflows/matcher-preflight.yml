name: Matcher release preflight
on:
  pull_request:
    paths: ['servers/three-way-match/**', 'servers/timezone/**', 'packages/mcp-license/**', 'package.json', 'package-lock.json', 'scripts/bootstrap-timezone.mjs', 'scripts/matcher-container-smoke.mjs', '.github/workflows/matcher-preflight.yml']
  push:
    branches: [main]
    paths: ['servers/three-way-match/**', 'servers/timezone/**', 'packages/mcp-license/**', 'package.json', 'package-lock.json', 'scripts/bootstrap-timezone.mjs', 'scripts/matcher-container-smoke.mjs', '.github/workflows/matcher-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matcher:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared workspace dependencies without prebuilt artifacts
        run: npm ci --ignore-scripts --workspace @theluckystrike/mcp-three-way-match --include-workspace-root=false --no-audit --no-fund
      - name: Bootstrap engine and test the source build
        run: |
          node scripts/bootstrap-timezone.mjs
          npm run build --workspace @theluckystrike/mcp-license
          npm run build --workspace @theluckystrike/mcp-three-way-match
          npm test --workspace @theluckystrike/mcp-three-way-match
      - name: Build the documented Docker image
        run: docker build --tag mcp-three-way-match:ci --file servers/three-way-match/Dockerfile .
      - name: Match real structured documents through the container MCP transport
        run: node scripts/matcher-container-smoke.mjs
